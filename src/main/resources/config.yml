# ============================================================
# PLÜSSBOLT – ÁLTALÁNOS BEÁLLÍTÁSOK
# ============================================================
currency:
  # A pénznem neve az árak mellett. A pénzt Vaulton keresztül vonja le.
  suffix: "&2💲"

# ============================================================
# KATEGÓRIÁK ÉS FEJEK
# ============================================================
# A kategóriák neve és ikonja szabadon módosítható.
# Az icon mezőbe bármilyen Minecraft tárgy/blokk neve írható (pl. DIAMOND_BLOCK).
# Ha egyedi fej legyen az ikon, az icon-command mezőbe tegyél Give Code parancsot.
# Ha az icon-command ki van töltve, az felülírja az icon mezőt.
# A kategóriák alapikonja az icon mezőben van.
# Minden kategóriánál ugyanaz az icon-command blokkos formátum szerepel.
# Egyedi ikonhoz másold ki a Minecraft-Heads oldalon a Server Command > Give Code parancsot,
# majd illeszd az adott kategória icon-command: >- sora alá, két szóközzel beljebb.
# Példa:
#   icon-command: >-
#     /minecraft:give @p minecraft:player_head[...] 1
# Blokk ikonhoz is használható; ilyenkor blokkhoz tartozó parancsot másolj.
# A blokkos formában az aposztróf (pl. Rubik's Cube) nem okoz YAML-hibát.
# Ne írj Rubik\\'s alakot: a backslash YAML-ban nem escape karakter.
# Üres parancsnál az icon mezőben beállított alapikon jelenik meg.
# Az icon-command kitöltésekor a parancsban szereplő tárgy/fej jelenik meg,
# és felülírja az icon mezőben megadott alap ikont.
# A "Minden" kategória automatikusan összegyűjti az összes többi kategória termékeit.
#
# Fej hozzáadásához a megfelelő kategória products része alá másolj egy bejegyzést:
#   egyedi_azonosito:
#     name: "A fej magyar neve"
#     price: 10
#     command: >-
#       /minecraft:give @p minecraft:player_head[...] 1
#
# A command mezőbe a Minecraft-Heads oldalán válaszd a szerververziódat,
# majd a Server Command > Give Code parancsot másold be.
# Az @p helyére vásárláskor a vevő játékos neve kerül.
# A parancsból próbálja a bolt a fej ikonjának textúráját is beállítani.
# A parancsot ne tedd egyszeres idézőjelek közé; használd a fenti >- formát.
# Minden kategóriában két minta termék szerepel. A command mezőket töltsd ki
# a saját Give Code parancsaiddal; üres command esetén a vásárlás nem ad tárgyat.

